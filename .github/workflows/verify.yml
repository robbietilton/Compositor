name: Verify

on:
  push:
  pull_request:
  # Weekly, and by hand from the Actions tab, every suite runs, the filter suites included.
  schedule:
    - cron: '0 9 * * 1'
  workflow_dispatch:

concurrency:
  group: verify-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  unit:
    name: unit
    # Push covers same-repo branches. pull_request runs only for forks, so a PR is not tested twice.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name != github.repository
    runs-on: macos-26
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          # History, to see what a push changed.
          fetch-depth: 0

      # The filter suites (Camera Raw, Hue/Saturation, Levels, the filters) run only when something they cover
      # changed. The project file counts, so a version bump runs them all and every release is checked in full.
      - name: Decide whether the filter suites run
        id: scope
        env:
          EVENT: ${{ github.event_name }}
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          filters=true
          if [[ "$EVENT" == push || "$EVENT" == pull_request ]] && [[ -n "$BASE" && ! "$BASE" =~ ^0+$ ]] \
             && git cat-file -e "$BASE^{commit}" 2>/dev/null; then
            git diff --name-only "$BASE" HEAD > changed.txt
            pattern='^Compositor/Document/(CameraRaw|Filters|HueSaturation|ImageAdjustments|Levels|Curves|Scanlines|Dither|PixelAdjust|AdjustmentEditing|LayerAdjustment)'
            pattern+='|^Compositor/Rendering/(AdjustPixels|LevelsPixels|DitherPixels|LensPixels|NoisePixels|GPUNoise|AdjustmentSurface)'
            pattern+='|^Compositor/UI/(CameraRaw|Curves|FilterSheet|HueSaturation|Levels)'
            pattern+='|^CompositorTests/(CameraRaw|HueSaturation|ImageAdjustment|Levels|Filter|Scanlines|FinishingFilter)'
            pattern+='|^Compositor\.xcodeproj/|^\.github/workflows/verify\.yml|^scripts/ci-tests\.sh'
            grep -qE "$pattern" changed.txt || filters=false
          fi
          echo "filters=$filters" >> "$GITHUB_OUTPUT"
          echo "Filter suites: $filters"

      - name: Select Xcode 26.6
        run: sudo xcode-select -s /Applications/Xcode_26.6.app

      - name: Resolve Swift packages
        run: >
          xcodebuild -resolvePackageDependencies
          -project Compositor.xcodeproj
          -scheme Compositor
          -onlyUsePackageVersionsFromResolvedFile

      # Optimized, as in a release, still testable: unoptimized, pixel loops (the app's and the tests' own) take
      # many times longer.
      - name: Build for testing
        id: build
        run: >
          xcodebuild build-for-testing
          -project Compositor.xcodeproj
          -scheme Compositor
          -destination 'platform=macOS,arch=arm64'
          -configuration Debug
          -derivedDataPath DerivedData
          CODE_SIGN_IDENTITY=-
          GCC_OPTIMIZATION_LEVEL=s
          SWIFT_OPTIMIZATION_LEVEL=-O

      - name: Run unit tests
        env:
          FILTERS: ${{ steps.scope.outputs.filters }}
        run: scripts/ci-tests.sh DerivedData

      - name: Upload test results
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: unit-test-results
          # The app's crash reports too: a test that crashes the app shows only "signal segv" in the results.
          path: |
            *.xcresult
            *.log
            ~/Library/Logs/DiagnosticReports/Compositor*.ips
          retention-days: 7
          if-no-files-found: ignore

  # Screenshots of the main screens (CompositorUITests/ScreenshotTests), kept with the run to look at. Informational:
  # a screen that couldn't be reached doesn't fail the run.
  screenshots:
    name: screenshots
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name != github.repository
    runs-on: macos-26
    timeout-minutes: 30
    continue-on-error: true
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Select Xcode 26.6
        run: sudo xcode-select -s /Applications/Xcode_26.6.app

      # UI tests drive the app with the mouse and keyboard, which macOS otherwise asks a person to allow.
      - name: Allow UI automation
        run: sudo automationmodetool enable-automationmode-without-authentication

      - name: Take screenshots
        run: >
          xcodebuild test
          -project Compositor.xcodeproj
          -scheme Screenshots
          -destination 'platform=macOS,arch=arm64'
          -derivedDataPath DerivedData
          -resultBundlePath Screenshots.xcresult
          CODE_SIGN_IDENTITY=-
          GCC_OPTIMIZATION_LEVEL=s
          SWIFT_OPTIMIZATION_LEVEL=-O

      - name: Collect screenshots
        if: ${{ !cancelled() }}
        run: |
          xcrun xcresulttool export attachments --path Screenshots.xcresult --output-path exported
          # Named as the test named them ("01 Start.png"), not by the IDs they're exported under.
          mkdir -p screenshots
          python3 - <<'PY'
          import json, os, re, shutil
          for test in json.load(open("exported/manifest.json")):
              for item in test.get("attachments", []):
                  name = re.sub(r"_\d+_[0-9A-Fa-f-]+(\.\w+)$", r"\1", item["suggestedHumanReadableName"])
                  shutil.copy(os.path.join("exported", item["exportedFileName"]), os.path.join("screenshots", name))
          PY
          ls screenshots

      - name: Upload screenshots
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: screenshots-macos-26
          path: screenshots
          retention-days: 30
          if-no-files-found: warn

  # The iPad app and its tests, built with this Xcode and not run for now: see the step.
  ipad:
    name: ipad
    # As for unit: push covers same-repo branches, and pull_request only forks.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name != github.repository
    runs-on: macos-26
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Select Xcode 26.6
        run: sudo xcode-select -s /Applications/Xcode_26.6.app

      # Whichever iPad the runner has, on its newest iOS.
      - name: Pick an iPad simulator
        id: simulator
        run: |
          udid=$(xcrun simctl list devices available -j | python3 -c '
          import json, sys
          devices = json.load(sys.stdin)["devices"]
          runtimes = sorted((r for r in devices if ".iOS-" in r), key=lambda r: [int(n) for n in r.split(".iOS-")[1].split("-")], reverse=True)
          print(next(d["udid"] for r in runtimes for d in devices[r] if d["name"].startswith("iPad")))')
          echo "udid=$udid" >> "$GITHUB_OUTPUT"

      # Builds the iPad app and its tests with this Xcode, without running them for now. On the hosted runner, one at a
      # time, the 541 tests outlast the job's hour, and those that wait on the window or a picker run out of their time
      # there; side by side on several clones, a minute's limit ends the run. They all pass on an iPad simulator on
      # iOS 26.5 on a Mac: `xcodebuild test -scheme CompositorPad -parallel-testing-enabled NO CODE_SIGNING_ALLOWED=NO`.
      # Running them here again waits on making those waits hold up on a slower machine.
      - name: Build the iPad app and its tests
        run: >
          xcodebuild build-for-testing
          -project Compositor.xcodeproj
          -scheme CompositorPad
          -destination 'platform=iOS Simulator,id=${{ steps.simulator.outputs.udid }}'
          -derivedDataPath DerivedData
          -resultBundlePath PadResults.xcresult
          CODE_SIGNING_ALLOWED=NO

      - name: Upload test results
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: ipad-test-results
          path: PadResults.xcresult
          retention-days: 7
          if-no-files-found: ignore
