name: Build Compositor for Intel macOS 15

on:
  workflow_dispatch:

jobs:
  build:
    name: Intel macOS 15 / Xcode inspection
    runs-on: macos-15

    steps:
      - name: Checkout Compositor macOS 15 PR
        uses: actions/checkout@v4
        with:
          repository: robbietilton/Compositor
          ref: refs/pull/8/head
          fetch-depth: 1

      - name: Select Xcode 26.3
        run: |
          sudo xcode-select -s /Applications/Xcode_26.3.app
          
          echo "=== Xcode ==="
          xcodebuild -version

          echo
          echo "=== SDK ==="
          xcrun --sdk macosx --show-sdk-path

          echo
          echo "=== Swift ==="
          swift --version

          echo
          echo "=== Runner architecture ==="
          uname -m

          echo
          echo "=== Target architecture ==="
          xcodebuild -project Compositor.xcodeproj \
            -scheme Compositor \
            -showBuildSettings | \
            grep -E 'ARCHS|MACOSX_DEPLOYMENT_TARGET'

      - name: Resolve Swift packages
        run: |
          xcodebuild \
            -resolvePackageDependencies \
            -project Compositor.xcodeproj \
            -scheme Compositor

      - name: Build Intel Release
        run: |
          set -o pipefail

          xcodebuild \
            -project Compositor.xcodeproj \
            -scheme Compositor \
            -configuration Release \
            -derivedDataPath "$GITHUB_WORKSPACE/build" \
            -destination 'generic/platform=macOS' \
            ARCHS=x86_64 \
            ONLY_ACTIVE_ARCH=NO \
            MACOSX_DEPLOYMENT_TARGET=15.0 \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            build

      - name: Verify Intel architecture
        run: |
          APP="$GITHUB_WORKSPACE/build/Build/Products/Release/Compositor.app"
          BINARY="$APP/Contents/MacOS/Compositor"

          echo "=== Executable ==="
          file "$BINARY"

          echo
          echo "=== Architectures ==="
          lipo -info "$BINARY"

          echo
          echo "=== App ==="
          ls -lah "$APP"

      - name: Verify deployment target
        run: |
          APP="$GITHUB_WORKSPACE/build/Build/Products/Release/Compositor.app"
          BINARY="$APP/Contents/MacOS/Compositor"

          echo "=== LC_BUILD_VERSION ==="
          otool -l "$BINARY" | grep -A3 LC_BUILD_VERSION

      - name: Ad-hoc sign
        run: |
          APP="$GITHUB_WORKSPACE/build/Build/Products/Release/Compositor.app"

          codesign \
            --deep \
            --force \
            --verbose \
            --sign - \
            "$APP"

          codesign \
            --verify \
            --deep \
            --strict \
            --verbose \
            "$APP"

      - name: Package app
        run: |
          mkdir -p dist

          ditto \
            -c \
            -k \
            --keepParent \
            "$GITHUB_WORKSPACE/build/Build/Products/Release/Compositor.app" \
            "dist/Compositor-macOS15-Intel.zip"

      - name: Generate checksum
        run: |
          echo "=== SHA-256 ==="
          shasum -a 256 dist/Compositor-macOS15-Intel.zip

      - name: Upload Intel macOS 15 build
        uses: actions/upload-artifact@v4
        with:
          name: Compositor-macOS15-Intel
          path: dist/Compositor-macOS15-Intel.zip
          if-no-files-found: error
          retention-days: 30
