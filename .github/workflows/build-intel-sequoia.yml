name: Build Compositor for Intel macOS 15

on:
  workflow_dispatch:

jobs:
  build:
    name: Intel macOS 15 / Xcode 26.3
    runs-on: macos-15-intel

    steps:
      - name: Checkout Compositor PR #8
        uses: actions/checkout@v4
        with:
          repository: robbietilton/Compositor
          ref: 648a586
          fetch-depth: 1

      - name: Select Xcode 26.3
        run: |
          sudo xcode-select -s /Applications/Xcode_26.3.app

          echo "=== Xcode ==="
          xcodebuild -version

          echo "=== Host ==="
          uname -m

      - name: Resolve Swift packages
        run: |
          xcodebuild \
            -resolvePackageDependencies \
            -project Compositor.xcodeproj \
            -scheme Compositor

      - name: Build Intel Release
        run: |
          xcodebuild \
            -project Compositor.xcodeproj \
            -scheme Compositor \
            -configuration Release \
            -derivedDataPath "$GITHUB_WORKSPACE/build" \
            -destination 'generic/platform=macOS' \
            ARCHS=x86_64 \
            ONLY_ACTIVE_ARCH=NO \
            MACOSX_DEPLOYMENT_TARGET=15.0 \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            build

      - name: Verify architecture and deployment target
        run: |
          APP="$GITHUB_WORKSPACE/build/Build/Products/Release/Compositor.app"

          echo "=== Architecture ==="
          file "$APP/Contents/MacOS/Compositor"
          lipo -info "$APP/Contents/MacOS/Compositor"

          echo "=== Deployment target ==="
          otool -l "$APP/Contents/MacOS/Compositor" \
            | grep -A3 LC_BUILD_VERSION

          echo "=== App ==="
          ls -lah "$APP"

      - name: Ad-hoc sign
        run: |
          APP="$GITHUB_WORKSPACE/build/Build/Products/Release/Compositor.app"

          codesign \
            --deep \
            --force \
            --verbose \
            --sign - \
            "$APP"

          codesign --verify --deep --strict --verbose "$APP"

      - name: Create ZIP
        run: |
          mkdir -p dist

          ditto \
            -c \
            -k \
            --keepParent \
            "$GITHUB_WORKSPACE/build/Build/Products/Release/Compositor.app" \
            "dist/Compositor-macOS15-Intel.zip"

      - name: Show artifact
        run: |
          ls -lh dist/
          shasum -a 256 dist/Compositor-macOS15-Intel.zip

      - name: Upload Intel macOS 15 build
        uses: actions/upload-artifact@v4
        with:
          name: Compositor-macOS15-Intel
          path: dist/Compositor-macOS15-Intel.zip
          if-no-files-found: error
          retention-days: 30
